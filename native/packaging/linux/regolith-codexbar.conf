# Keep CodexBar's cross-platform windows usable in Regolith's tiling session.
for_window [class="^codexbar-native$" title="^CodexBar$"] floating enable, resize set 460 px 580 px, move position center, border pixel 2
for_window [class="^codexbar-native$" title="^About CodexBar$"] floating enable, resize set 380 px 360 px, move position center, border pixel 2

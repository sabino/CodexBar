# Keep CodexBar's cross-platform windows usable in Regolith's tiling session.
for_window [class="^codexbar-native$" title="^CodexBar$"] floating enable, resize set 340 px 480 px, move position center, border pixel 2
# Regolith reports this laptop's 150% UI scale to Slint. Request physical
# pixels here so the resulting logical window matches upstream's 880x620.
for_window [class="^codexbar-native$" title="^CodexBar Settings$"] floating enable, resize set 1320 px 930 px, move position center, border pixel 2
for_window [class="^codexbar-native$" title="^About CodexBar$"] floating enable, resize set 380 px 360 px, move position center, border pixel 2

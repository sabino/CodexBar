name: Native UI

on:
  push:
    branches: [main, feat/linux]
    paths:
      - "native/**"
      - "Sources/CodexBarCLI/CLIConfigCommand.swift"
      - "Sources/CodexBarCLI/DashboardPayloads.swift"
      - "Sources/CodexBarCLI/DashboardSnapshotBuilder.swift"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "Sources/CodexBarCLI/CLIConfigCommand.swift"
      - "Sources/CodexBarCLI/DashboardPayloads.swift"
      - "Sources/CodexBarCLI/DashboardSnapshotBuilder.swift"
      - ".github/workflows/native.yml"

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: macOS arm64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2025

    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +1.93.1 fmt --all -- --check

      - name: Lint
        run: cargo +1.93.1 clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo +1.93.1 test --locked

      - name: Build release binary
        run: cargo +1.93.1 build --release --locked
